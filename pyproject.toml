[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicml-biodetect"
version = "0.2.0"
description = "Synthetic spectral-amplitude inverse-problem benchmark"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Biswajit Jana"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.8,<4", "pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
legacy-pinn = [
    "astropy>=6,<8",
    "h5py>=3,<4",
    "pymc>=5,<6",
    "pytorch-lightning>=2,<3",
    "pyyaml>=6,<7",
    "scipy>=1.12,<2",
    "torch>=2.2,<3",
    "tqdm>=4.60,<5",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Biswajit1999/cosmicml-biodetect"
"Bug Tracker" = "https://github.com/Biswajit1999/cosmicml-biodetect/issues"
"Source Code" = "https://github.com/Biswajit1999/cosmicml-biodetect"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/cosmicml"]
omit = ["*/tests/*", "*/__init__.py"]
