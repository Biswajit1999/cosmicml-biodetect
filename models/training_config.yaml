accumulation_steps: 4
cpu_optimization:
  mkldnn: true
  num_threads: 4
data:
  batch_size: 8
  input_dim: 512
  latent_dim: 64
  num_workers: 1
  output_dim: 10
  pin_memory: false
  prefetch_factor: 1
device: cpu
logging:
  log_interval: 50
  save_dir: models/
  tensorboard: false
  wandb: false
mixed_precision: false
model:
  activation: relu
  architecture: pinn
  dropout: 0.1
  hidden_layers:
  - 256
  - 128
  - 64
  physics_weight: 1.0
seed: 42
training:
  epochs: 100
  learning_rate: 0.001
  optimizer: adam
  scheduler: cosine
  scheduler_params:
    T_max: 100
    eta_min: 1.0e-06
  weight_decay: 0.0001
validation:
  patience: 25
  save_best_only: true
  val_interval: 5
  val_split: 0.1
